name: Project checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    # Replace both version placeholders with the same published immutable release tag.
    # Both compatibility channels run on every declared architecture.
    uses: petohorvath/nixos-project-policy/.github/workflows/check.yml@POLICY_VERSION
    with:
      project: PROJECT_NAME
      policy_version: POLICY_VERSION
      required_architectures: '["x86_64-linux", "aarch64-linux"]'
      # Other Nix systems use self-hosted runners labelled with the system name.
      # Optional list inputs default to empty lists.
      # VM architecture defaults to x86_64-linux; other Linux systems need KVM
      # on a self-hosted runner labelled with the system name.
      # vm_architecture: aarch64-linux
      # vm_targets: '["vm-tests"]'
      # additional_required_checks: '["Integration"]'
