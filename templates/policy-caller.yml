name: Project checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    # Replace both version placeholders with the same published immutable release tag.
    # The policy workflow owns the default check and all four compatibility runs.
    uses: petohorvath/nixos-project-policy/.github/workflows/check.yml@POLICY_VERSION
    with:
      project: PROJECT_NAME
      policy_version: POLICY_VERSION
