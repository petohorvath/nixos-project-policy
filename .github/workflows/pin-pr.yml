name: Central pin proposal

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pin-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture pin proposal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    outputs:
      baseline: ${{ steps.capture.outputs.baseline }}
      head: ${{ steps.capture.outputs.head }}
      batch: ${{ steps.capture.outputs.batch }}
      classification: ${{ steps.capture.outputs.classification }}
      check: ${{ steps.capture.outputs.check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: proposal
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Bind the trusted workflow and exact proposal head
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROPOSAL_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          status=0
          nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-pr capture --proposal-root ./proposal --number "$PR_NUMBER" --head "$PROPOSAL_HEAD" --run "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$RUNNER_TEMP/pin-context" || status=$?
          if test -f "$RUNNER_TEMP/pin-context/result.json"; then
            jq -r '"baseline=\(.baseline.revision // "")\nhead=\(.head // "")\nbatch=\(.batch // "")\nclassification=\(.classification // "")\ncheck=\(.check // 0)"' "$RUNNER_TEMP/pin-context/result.json" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Preserve proposal capture and inspection errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pin-context
          if-no-files-found: error
  plan:
    name: Plan pin candidate
    needs: capture
    if: needs.capture.outputs.classification == 'candidate'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      runnable: ${{ steps.plan.outputs.runnable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.capture.outputs.baseline }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.capture.outputs.head }}
          path: proposal
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Plan every enrolled member at its registered revision
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ needs.capture.outputs.batch }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          status=0
          nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-batch plan ./members --all --fetch --proposal-root ./proposal --batch "$BATCH" --attempt "$ATTEMPT" --output "$RUNNER_TEMP/pin-plan" || status=$?
          if test -f "$RUNNER_TEMP/pin-plan/plan.json"; then
            matrix=$(jq -ce '.matrix' "$RUNNER_TEMP/pin-plan/plan.json")
            runnable=$(jq -r '.matrix.include | length > 0' "$RUNNER_TEMP/pin-plan/plan.json")
            printf 'matrix=%s\nrunnable=%s\n' "$matrix" "$runnable" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Preserve planned and unavailable members
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pin-plan
          if-no-files-found: error
  execute:
    name: Candidate member (${{ matrix.project }}, ${{ matrix.system }})
    needs: [capture, plan]
    if: always() && needs.plan.outputs.runnable == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.capture.outputs.baseline }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.capture.outputs.head }}
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: member
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pin-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pin-plan
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
          enable_kvm: ${{ matrix.system == 'x86_64-linux' }}
      - name: Execute the captured native member coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
          SYSTEM: ${{ matrix.system }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
        run: nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-batch execute ./member --all --proposal-root ./proposal --plan "$RUNNER_TEMP/pin-plan/plan.json" --project "$PROJECT" --system "$SYSTEM" --attempt "$ATTEMPT" --output "$RUNNER_TEMP/pin-result"
      - name: Preserve native candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.worker }}
          path: ${{ runner.temp }}/pin-result
          if-no-files-found: error
  aggregate:
    name: Aggregate pin candidate
    needs: [capture, plan, execute]
    if: always() && needs.capture.outputs.classification == 'candidate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.capture.outputs.baseline }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.capture.outputs.head }}
          path: proposal
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Verify hosted provenance and require the complete batch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROPOSAL_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          status=0
          nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-pr collect --proposal-root ./proposal --number "$PR_NUMBER" --head "$PROPOSAL_HEAD" --run "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "$RUNNER_TEMP/pin-provenance" || status=$?
          mkdir -p "$RUNNER_TEMP/pin-provenance/workers"
          nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-batch aggregate ./members --all --fetch --proposal-root ./proposal --plan "$RUNNER_TEMP/pin-provenance/plan/plan.json" --results "$RUNNER_TEMP/pin-provenance/workers" --attempt "$RUN_ID:$RUN_ATTEMPT" --worker-outcomes "$RUNNER_TEMP/pin-provenance/worker-outcomes.json" --output "$RUNNER_TEMP/pin-summary" || status=$?
          exit "$status"
      - name: Preserve complete assessment and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pin-summary
          if-no-files-found: error
      - name: Preserve independent GitHub provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pin-provenance/result.json
            ${{ runner.temp }}/pin-provenance/worker-outcomes.json
          if-no-files-found: error
  finish:
    name: Report exact pin proposal
    needs: [capture, plan, execute, aggregate]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposal
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Reassess freshness and publish the exact-head result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROPOSAL_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CHECK_ID: ${{ needs.capture.outputs.check }}
        run: nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-pr finish --proposal-root ./proposal --number "$PR_NUMBER" --head "$PROPOSAL_HEAD" --run "$RUN_ID" --attempt "$RUN_ATTEMPT" --check "${CHECK_ID:-0}" --output "$RUNNER_TEMP/pin-report"
      - name: Preserve final PR assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pin-report
          if-no-files-found: error
