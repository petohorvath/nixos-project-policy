name: Propose pin bump

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      stable_revision:
        description: Exact stable nixpkgs revision; supply both revisions or neither
        type: string
      unstable_revision:
        description: Exact unstable nixpkgs revision; supply both revisions or neither
        type: string

permissions:
  contents: read

concurrency:
  group: pin-bump
  cancel-in-progress: false

env:
  BRANCH: automation/pin-bump

jobs:
  propose:
    name: Propose pin bump
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Resolve the proposed revisions
        id: revisions
        env:
          STABLE_REVISION: ${{ inputs.stable_revision }}
          UNSTABLE_REVISION: ${{ inputs.unstable_revision }}
        run: |
          if test -n "$STABLE_REVISION" || test -n "$UNSTABLE_REVISION"; then
            if ! [[ "$STABLE_REVISION" =~ ^[0-9a-f]{40}$ && "$UNSTABLE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Supply both exact 40-character revisions or neither"
              exit 1
            fi
            stable=$STABLE_REVISION
            unstable=$UNSTABLE_REVISION
          else
            stable_branch=$(jq -r .stableBranch data/pins.json)
            stable=$(git ls-remote https://github.com/NixOS/nixpkgs.git "refs/heads/$stable_branch" | cut -f1)
            unstable=$(git ls-remote https://github.com/NixOS/nixpkgs.git refs/heads/nixos-unstable | cut -f1)
          fi
          printf 'stable=%s\nunstable=%s\n' "$stable" "$unstable" >> "$GITHUB_OUTPUT"
      - name: Write the proposed pins and patch version
        id: proposal
        env:
          STABLE: ${{ steps.revisions.outputs.stable }}
          UNSTABLE: ${{ steps.revisions.outputs.unstable }}
        run: |
          nix develop --no-update-lock-file --command \
            python tools/pin_bump.py propose --stable "$STABLE" --unstable "$UNSTABLE" > "$RUNNER_TEMP/proposal.json"
          jq . "$RUNNER_TEMP/proposal.json"
          jq -r '"status=\(.status)", "tag=\(.tag)"' "$RUNNER_TEMP/proposal.json" >> "$GITHUB_OUTPUT"
      - name: Open or update the pin-bump PR and start its tests
        if: steps.proposal.outputs.status == 'proposed'
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.revisions.outputs.stable }}
          UNSTABLE: ${{ steps.revisions.outputs.unstable }}
          TAG: ${{ steps.proposal.outputs.tag }}
        run: |
          title="chore(pins): Release $TAG with new nixpkgs pins"
          body=$(printf '%s\n' \
            "Stable pin: \`$STABLE\`" \
            "Unstable pin: \`$UNSTABLE\`" \
            "" \
            "Merging this PR tags \`$TAG\` and moves its minor-series tag." \
            "The Pin-bump tests workflow tests the \`main\` branch of every listed repo with these pins.")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add data/pins.json policy/pins.json VERSION CHANGELOG.md
          git commit --quiet --message "$title"
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if test -n "$number"; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
          # GITHUB_TOKEN pushes start no pull_request runs; dispatch the PR's tests.
          gh workflow run pin-bump-tests.yml --ref "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
