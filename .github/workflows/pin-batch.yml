name: Complete candidate batch

on:
  workflow_dispatch:
    inputs:
      proposal_revision:
        description: Exact policy commit containing the proposed pin batch
        required: true
        type: string
      batch:
        description: Proposed batch identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.subject.outputs.baseline }}
      proposal: ${{ steps.subject.outputs.proposal }}
      matrix: ${{ steps.plan.outputs.matrix }}
      runnable: ${{ steps.plan.outputs.runnable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.proposal_revision }}
          path: proposal
          persist-credentials: false
      - name: Capture exact authority and proposal
        id: subject
        env:
          PROPOSAL_REVISION: ${{ inputs.proposal_revision }}
        run: |
          [[ "$PROPOSAL_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C proposal rev-parse HEAD)" = "$PROPOSAL_REVISION"
          printf 'baseline=%s\nproposal=%s\n' "$(git -C authority rev-parse HEAD)" "$PROPOSAL_REVISION" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Capture every enrolled participant and required worker
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ inputs.batch }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          status=0
          nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-batch plan ./members --all --fetch --proposal-root ./proposal --batch "$BATCH" --attempt "$ATTEMPT" --output "$RUNNER_TEMP/batch-plan" || status=$?
          if test -f "$RUNNER_TEMP/batch-plan/plan.json"; then
            matrix=$(jq -ce '.matrix' "$RUNNER_TEMP/batch-plan/plan.json")
            runnable=$(jq -r '.matrix.include | length > 0' "$RUNNER_TEMP/batch-plan/plan.json")
            printf 'matrix=%s\nrunnable=%s\n' "$matrix" "$runnable" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Preserve complete and partial planning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-plan
          if-no-files-found: error
  execute:
    name: Candidate member (${{ matrix.project }}, ${{ matrix.system }})
    needs: plan
    if: always() && needs.plan.outputs.runnable == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.baseline }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.proposal }}
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: member
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: batch-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-plan
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
          enable_kvm: ${{ matrix.system == 'x86_64-linux' }}
      - name: Execute captured native member checks
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
          SYSTEM: ${{ matrix.system }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
        run: nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-batch execute ./member --all --proposal-root ./proposal --plan "$RUNNER_TEMP/batch-plan/plan.json" --project "$PROJECT" --system "$SYSTEM" --attempt "$ATTEMPT" --output "$RUNNER_TEMP/batch-result"
      - name: Preserve worker outcomes and replay artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch-result-${{ github.run_attempt }}-${{ matrix.worker }}
          path: ${{ runner.temp }}/batch-result
          if-no-files-found: error
  aggregate:
    name: Complete enrolled batch
    needs: [plan, execute]
    if: always() && needs.plan.outputs.baseline != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.baseline }}
          path: authority
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.proposal }}
          path: proposal
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: batch-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: batch-result-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/batch-results
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Account for every required member and native outcome
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
          EXECUTION_STATUS: ${{ needs.execute.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/batch-results"
          nix run --no-update-lock-file ./authority -- --policy-root ./authority pin-batch aggregate ./members --all --fetch --proposal-root ./proposal --plan "$RUNNER_TEMP/batch-plan/plan.json" --results "$RUNNER_TEMP/batch-results" --attempt "$ATTEMPT" --execution-status "$EXECUTION_STATUS" --output "$RUNNER_TEMP/batch-summary"
      - name: Preserve complete batch assessment and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-summary
          if-no-files-found: error
