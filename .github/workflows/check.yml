name: Policy

on:
  workflow_call:
    inputs:
      systems:
        description: JSON list of the Nix systems to check and test
        default: '["x86_64-linux", "aarch64-linux"]'
        type: string

permissions:
  contents: read

# Every job runs the checker from the commit of this workflow file, so the
# checker and its bundled pins match the ref the caller selected.
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      check_matrix: ${{ steps.ci.outputs.check_matrix }}
      test_matrix: ${{ steps.ci.outputs.test_matrix }}
      vm_job: ${{ steps.ci.outputs.vm_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Plan jobs and required statuses
        id: ci
        env:
          SYSTEMS: ${{ inputs.systems }}
        run: |
          nix run --no-update-lock-file ./policy -- ci ./repo --systems "$SYSTEMS" > ci.json
          check_matrix=$(jq -ce '.checkMatrix' ci.json)
          test_matrix=$(jq -ce '.testMatrix' ci.json)
          vm_job=$(jq -re '.vmJob | booleans | tostring' ci.json)
          required=$(jq -r '.requiredChecks[] | "- `" + . + "`"' ci.json)
          {
            printf 'check_matrix=%s\n' "$check_matrix"
            printf 'test_matrix=%s\n' "$test_matrix"
            printf 'vm_job=%s\n' "$vm_job"
          } >> "$GITHUB_OUTPUT"
          printf '## Required statuses\n\n%s\n' "$required" >> "$GITHUB_STEP_SUMMARY"
  check:
    name: Check (${{ matrix.system }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          # Full history with every tag: the removal comparison needs the
          # last release tag, and check fails on a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Check the repo
        run: nix run --no-update-lock-file ./policy -- check ./repo
  tests:
    name: Tests (${{ matrix.nixpkgs }}, ${{ matrix.system }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Run nix flake check
        env:
          NIXPKGS: ${{ matrix.nixpkgs }}
        run: nix run --no-update-lock-file ./policy -- test ./repo --nixpkgs "$NIXPKGS"
  vm:
    name: VM tests
    needs: plan
    if: needs.plan.outputs.vm_job == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
          enable_kvm: true
      - name: Build discovered VM tests
        run: nix run --no-update-lock-file ./policy -- vm ./repo
