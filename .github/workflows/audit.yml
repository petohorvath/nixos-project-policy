name: Member audit

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Audit enrolled selections and merge gates
        env:
          GH_TOKEN: ${{ secrets.MEMBER_AUDIT_TOKEN }}
        run: nix run --no-update-lock-file .# -- --policy-root . audit "$RUNNER_TEMP/projects" --fetch --github > audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: drift-audit
          path: audit.json
          if-no-files-found: error
