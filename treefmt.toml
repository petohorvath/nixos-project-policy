excludes = [".git/**", ".direnv/**", "result", "result-*/**", "*.lock", "**/__pycache__/**", ".ruff_cache/**"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w", "-i", "2"]
includes = ["*.sh", ".envrc"]

[formatter.prose]
command = "prettier"
options = ["--write"]
includes = ["*.md", "*.yaml", "*.yml", "*.json"]

[formatter.python]
command = "ruff"
options = ["format"]
includes = ["*.py"]
