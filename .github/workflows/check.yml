name: Shared policy

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      policy_version:
        description: Exact release tag, identical to the caller's uses reference
        required: true
        type: string
      required_architectures:
        description: Literal nonempty JSON list of Nix systems
        required: true
        type: string
      additional_required_checks:
        description: Literal JSON list of additional GitHub merge gates
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  records:
    name: Verify policy version and load shared pins
    runs-on: ubuntu-24.04
    outputs:
      checker_revision: ${{ steps.snapshot.outputs.checker_revision }}
      project_revision: ${{ steps.snapshot.outputs.project_revision }}
      matrix: ${{ steps.ci.outputs.matrix }}
      compatibility_matrix: ${{ steps.ci.outputs.compatibility_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: petohorvath/nixos-project-policy
          ref: refs/tags/${{ inputs.policy_version }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          persist-credentials: false
      - id: snapshot
        env:
          POLICY_VERSION: ${{ inputs.policy_version }}
        run: |
          test "$(cat policy/VERSION)" = "${POLICY_VERSION#v}"
          checker_revision=$(git -C policy rev-parse HEAD)
          project_revision=$(git -C project rev-parse HEAD)
          printf 'checker_revision=%s\nproject_revision=%s\n' \
            "$checker_revision" "$project_revision" >> "$GITHUB_OUTPUT"
          printf 'Policy %s: %s\nProject: %s\n' "$POLICY_VERSION" "$checker_revision" "$project_revision"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Load required architectures and checks
        id: ci
        env:
          PROJECT: ${{ inputs.project }}
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          nix run --no-update-lock-file ./policy -- ci ./project --project "$PROJECT" --inputs-json "$WORKFLOW_INPUTS" > ci.json
          matrix=$(jq -ce '.matrix' ci.json)
          compatibility_matrix=$(jq -ce '.compatibilityMatrix' ci.json)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'compatibility_matrix=%s\n' "$compatibility_matrix" >> "$GITHUB_OUTPUT"
  policy:
    name: ${{ matrix.check }} (${{ matrix.system }})
    needs: records
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.records.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          ref: ${{ needs.records.outputs.project_revision }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: petohorvath/nixos-project-policy
          ref: ${{ needs.records.outputs.checker_revision }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Report checked revisions
        run: |
          git -C project rev-parse HEAD
          git -C policy rev-parse HEAD
      - name: Check shared requirements
        if: matrix.check == 'Compliance'
        run: |
          nix run --no-update-lock-file ./policy -- check ./project --shell
      - name: Run project tests
        if: matrix.check == 'Project tests'
        run: nix run --no-update-lock-file ./policy -- test ./project --nixpkgs locked
  compatibility:
    name: ${{ matrix.check }}
    needs: records
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.records.outputs.compatibility_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          ref: ${{ needs.records.outputs.project_revision }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: petohorvath/nixos-project-policy
          ref: ${{ needs.records.outputs.checker_revision }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Run project tests with the bundled nixpkgs pin
        env:
          CHANNEL: ${{ matrix.channel }}
        run: nix run --no-update-lock-file ./policy -- test ./project --nixpkgs "$CHANNEL"
  vm:
    name: VM tests
    needs: records
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          ref: ${{ needs.records.outputs.project_revision }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: petohorvath/nixos-project-policy
          ref: ${{ needs.records.outputs.checker_revision }}
          path: policy
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
          enable_kvm: true
      - name: Build discovered VM tests
        run: nix run --no-update-lock-file ./policy -- vm ./project
