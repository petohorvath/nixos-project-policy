name: Project checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    # Replace both version placeholders with the same published immutable release tag.
    # Both compatibility channels run on every declared architecture.
    uses: petohorvath/nixos-project-policy/.github/workflows/check.yml@POLICY_VERSION
    with:
      project: PROJECT_NAME
      policy_version: POLICY_VERSION
      required_architectures: '["x86_64-linux", "aarch64-linux"]'
      # Optional inputs default to empty lists.
      # vm_targets: '["vm-tests"]'
      # additional_required_checks: '["Integration"]'
