name: Integration policy agreement

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      policy_version:
        description: Same exact release selected by the integration project's Policy caller
        required: true
        type: string
      project_revision:
        description: Captured project_revision output from the primary Policy caller
        required: true
        type: string
      records_revision:
        description: Captured records_revision output from the primary Policy caller
        required: true
        type: string

permissions:
  contents: read

jobs:
  agreement:
    name: Policy agreement
    runs-on: ubuntu-24.04
    steps:
      - name: Verify immutable policy release
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_VERSION: ${{ inputs.policy_version }}
          PROJECT_REVISION: ${{ inputs.project_revision }}
          RECORDS_REVISION: ${{ inputs.records_revision }}
        run: |
          [[ "$POLICY_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$PROJECT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECORDS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          release=$(gh api "repos/petohorvath/nixos-project-policy/releases/tags/$POLICY_VERSION")
          jq -e --arg version "$POLICY_VERSION" '
            .tag_name == $version and .immutable == true and .draft == false and .prerelease == false
          ' <<< "$release"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: petohorvath/nixos-project-policy
          ref: refs/tags/${{ inputs.policy_version }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: petohorvath/nixos-project-policy
          ref: ${{ inputs.records_revision }}
          path: policy-state
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project
          ref: ${{ inputs.project_revision }}
          persist-credentials: false
      - name: Record exact inspection sources
        env:
          POLICY_VERSION: ${{ inputs.policy_version }}
          PROJECT_REVISION: ${{ inputs.project_revision }}
          RECORDS_REVISION: ${{ inputs.records_revision }}
        run: |
          test "$(cat policy/VERSION)" = "${POLICY_VERSION#v}"
          test "$(git -C project rev-parse HEAD)" = "$PROJECT_REVISION"
          test "$(git -C policy-state rev-parse HEAD)" = "$RECORDS_REVISION"
          git -C project rev-parse HEAD
          git -C policy rev-parse HEAD
          git -C policy-state rev-parse HEAD
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
      - name: Check policy agreement at locked member revisions
        id: agreement
        env:
          PROJECT: ${{ inputs.project }}
        run: nix run --no-update-lock-file ./policy -- --policy-root ./policy-state agreement ./project --project "$PROJECT" > agreement.json
      - name: Upload agreement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-agreement
          path: agreement.json
          if-no-files-found: error
